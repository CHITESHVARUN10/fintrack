# Render Blueprint for FinTrack backend API.
# Deploy via Render Dashboard → New → Blueprint → point at this repo.
# Then fill the sync:false env vars below in the Render dashboard.
# IMPORTANT: never commit real secrets — set them in Render, not here.

services:
  - type: web
    name: fintrack-api
    runtime: node
    rootDir: backend
    buildCommand: pnpm install --frozen-lockfile
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: ">=26.13.1 <27"
      # Set this to the hosted MongoDB URI. Legacy URI variables take precedence if set.
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      # Optional additional direct browser origins. The hosted web app
      # uses its own /api path via the Vercel rewrite. Native apps use this API directly.
      - key: CORS_ORIGIN
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        value: '"FinTrack" <noreply@example.com>'
