# Render Blueprint for FinTrack backend API.
# Deploy via Render Dashboard → New → Blueprint → point at this repo.
# Then fill the sync:false env vars below in the Render dashboard.
# IMPORTANT: never commit real secrets — set them in Render, not here.

services:
  - type: web
    name: fintrack-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Point at the Atlas DB (same data migrated from local).
      # Either name works: db.js/app.js read MONGODB_URI, then mongo_uri_production.
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      # Comma-separated frontend origin(s), e.g. https://fintrack.vercel.app
      # Native mobile apps don't need CORS entries (no Origin header).
      - key: CORS_ORIGIN
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        value: '"FinTrack" <noreply@example.com>'
